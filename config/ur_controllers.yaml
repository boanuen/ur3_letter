# Same as ur_simulation_gz's ur_controllers.yaml, except the per-joint
# `trajectory` (path/state) tolerance is relaxed from 0.2 rad to "disabled"
# (-1.0, per ros2_control semantics: negative = not checked).
#
# Why: with the soft simulated position gain gz_ros2_control uses
# (position_proportional_gain = 0.1), the *default* 0.2 rad path tolerance
# routinely trips mid-trajectory in this WSL2 setup (observed on both the
# approach move and the Cartesian letter path, on different joints each
# time -- consistent with simulation timing jitter, not a planning bug),
# aborting an otherwise-valid, otherwise-successful execution.
#
# The `goal` tolerance (0.1 rad) is left as-is, so the final position is
# still checked -- only the "must stay this close *while moving*" check is
# relaxed. This is a simulation-only accommodation; a real robot would use
# tighter, hardware-appropriate tolerances.

controller_manager:
  ros__parameters:
    update_rate: 500 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    io_and_status_controller:
      type: ur_controllers/GPIOController

    speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController


speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: -1.0, goal: 0.1 }
      shoulder_lift_joint: { trajectory: -1.0, goal: 0.1 }
      elbow_joint: { trajectory: -1.0, goal: 0.1 }
      wrist_1_joint: { trajectory: -1.0, goal: 0.1 }
      wrist_2_joint: { trajectory: -1.0, goal: 0.1 }
      wrist_3_joint: { trajectory: -1.0, goal: 0.1 }


scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    speed_scaling_interface_name: ""
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: -1.0, goal: 0.1 }
      shoulder_lift_joint: { trajectory: -1.0, goal: 0.1 }
      elbow_joint: { trajectory: -1.0, goal: 0.1 }
      wrist_1_joint: { trajectory: -1.0, goal: 0.1 }
      wrist_2_joint: { trajectory: -1.0, goal: 0.1 }
      wrist_3_joint: { trajectory: -1.0, goal: 0.1 }

forward_velocity_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: velocity

forward_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
